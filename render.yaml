# Render Blueprint: one Docker web service + one PostgreSQL database.
# Single instance, single worker: the job poller runs in-process (see README "Operations").
# Secrets are `sync: false` — enter them in the Render dashboard; nothing secret is committed.
services:
  - type: web
    name: tradepilot-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/ready
    numInstances: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tradepilot-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL # https://<your-service>.onrender.com
        sync: false
      - key: ALLOWED_ORIGINS # same value as PUBLIC_BASE_URL
        sync: false
      - key: AI_MODE
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: PAYMENT_MODE # production refuses fixture payments
        value: paypal_sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MERCHANT_ID
        sync: false
      - key: PAYPAL_WEBHOOK_ID # webhook URL: https://<your-service>.onrender.com/api/webhooks/paypal
        sync: false
      - key: PAYPAL_PAYOUT_RECEIVER
        sync: false
      - key: CHANNEL3_MODE
        value: fixture
      - key: CHANNEL3_API_KEY
        sync: false
      - key: ENABLE_SCENARIOS
        value: "true"
      - key: VITE_AG_STUDIO_LICENSE_KEY # used at image build time; public browser value
        sync: false
databases:
  - name: tradepilot-db
    plan: free
    databaseName: tradepilot
    user: tradepilot
