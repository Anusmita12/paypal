name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tradepilot
          POSTGRES_PASSWORD: local-dev-only
          POSTGRES_DB: tradepilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tradepilot" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://tradepilot:local-dev-only@localhost:5432/tradepilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install "uv>=0.13,<0.14"
      - name: Backend lint and tests (offline fixture modes)
        working-directory: backend
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend typecheck and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: End-to-end (Playwright, offline)
        working-directory: frontend
        run: |
          PGPASSWORD=local-dev-only psql -h localhost -U tradepilot -d tradepilot_test -c "CREATE DATABASE tradepilot_e2e"
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results
